
global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "file" {
        path = "/vault/data"
      }

  dataStorage:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce

  dev:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP
